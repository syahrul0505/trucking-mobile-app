name: trucking_mobile
description: "Precision Trucking Driver App - Dedicated Native GPS & Trip Tracker"
publish_to: "none"
version: 1.5.1+11

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  battery_plus: ^6.1.1
  flutter_spinkit: ^5.2.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
