name: trucking_mobile
description: "Precision Trucking & Driver Tracking Mobile App (WebView + High-Accuracy GPS)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.1.0
  permission_handler: ^11.3.1
  flutter_spinkit: ^5.2.1
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.1
  url_launcher: ^6.3.1
  fluttertoast: ^8.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
