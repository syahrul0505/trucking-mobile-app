name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Create Flutter Project Skeleton if needed
        run: |
          echo "Generating clean standard Flutter Android runner..."
          mkdir -p /tmp/clean_flutter
          cd /tmp/clean_flutter
          flutter create --org com.precision --project-name trucking_mobile --platforms android .
          
          # Copy standard android folder
          cd $GITHUB_WORKSPACE
          cp -r /tmp/clean_flutter/android .

          # Configure compileSdk 34 in android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle
          
          # Fix geolocator compileSdk bug on Gradle 8+
          cat << 'EOF' > android/app/fix.gradle
          gradle.projectsEvaluated {
              subprojects {
                  if (it.hasProperty('android')) {
                      it.android {
                          compileSdkVersion 34
                      }
                  }
              }
          }
          EOF
          echo "apply from: 'fix.gradle'" >> android/app/build.gradle

          # Ensure AndroidManifest has GPS permissions
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"\/>' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: precision-trucking-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.1.0
          name: Precision Trucking Driver GPS v1.1.0
          body: |
            ## 🚚 Precision Trucking Driver Companion (Native App)
            - **No WebView**: 100% Native Mobile Flutter UI (Dark Futuristic Bento Design)
            - **Driver Login**: Direct credential authentication via Laravel Sanctum REST API
            - **GPS Live Tracking**: Native OpenStreetMap tiles, live telemetry (Speed, Battery, Ping Counter)
            - **High-Accuracy Background GPS**: Continuous hardware sensor stream
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
