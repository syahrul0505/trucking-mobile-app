name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Create Flutter Project Skeleton if needed
        run: |
          echo "Generating clean standard Flutter Android runner..."
          mkdir -p /tmp/clean_flutter
          cd /tmp/clean_flutter
          flutter create --org com.precision --project-name trucking_mobile --platforms android .
          
          # Copy standard android folder
          cd $GITHUB_WORKSPACE
          rm -rf android
          cp -r /tmp/clean_flutter/android .

          # Copy custom app icons into mipmap folders
          echo "Installing Precision launcher icons..."
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            if [ -f "assets/launcher/$d/ic_launcher.png" ]; then
              cp "assets/launcher/$d/ic_launcher.png" "android/app/src/main/res/$d/ic_launcher.png"
            fi
          done

          # Ensure AndroidManifest has GPS permissions
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        run: |
          flutter pub get
          sed -i 's/android:label="[^"]*"/android:label="Precision Driver"/' android/app/src/main/AndroidManifest.xml

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: precision-trucking-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.3.3
          name: Precision Trucking Driver GPS v1.3.3
          body: |
            ## 🚚 Precision Trucking Driver Companion (Native App) v1.3.0
            - **In-App Auto Update**: Automatic version check against server on app launch & manual check in Account tab
            - **Custom Brand Icon**: Official Precision logo replaces default Flutter icon
            - **No Uninstall Needed**: Direct seamless update preserves login sessions & driver preferences
            - **Dashboard & Telemetry**: Full GPS route, speedometer, trip management
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
