name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Create Flutter Project Skeleton if needed
        run: |
          echo "Generating clean standard Flutter Android runner..."
          mkdir -p /tmp/clean_flutter
          cd /tmp/clean_flutter
          flutter create --org com.precision --project-name trucking_mobile --platforms android .
          
          # Copy standard android folder
          cd $GITHUB_WORKSPACE
          rm -rf android
          cp -r /tmp/clean_flutter/android .

          # Copy custom app icons into mipmap folders
          echo "Installing Precision launcher icons..."
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            if [ -f "assets/launcher/$d/ic_launcher.png" ]; then
              cp "assets/launcher/$d/ic_launcher.png" "android/app/src/main/res/$d/ic_launcher.png"
            fi
          done

          # Ensure AndroidManifest has GPS permissions
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"\/>' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        run: |
          flutter pub get
          sed -i 's/android:label="[^"]*"/android:label="Precision Driver"/' android/app/src/main/AndroidManifest.xml

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: precision-trucking-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.6.0
          name: Precision Trucking Driver GPS v1.6.0
          body: |
            ## 🚚 Precision Trucking Driver Companion (Native App) v1.6.0
            - **GPS tidak putus**: lokasi disimpan di HP saat buka WA / Maps / sinyal hilang, lalu dikirim otomatis (jejak tidak bolong)
            - **Lanjut otomatis**: tracking aktif kembali sendiri saat aplikasi dibuka lagi
            - **Pantau Armada (super-admin)**: lihat posisi & rute semua supir di HP
            - **Galeri Struk Pengeluaran di HP**: Supir dapat melihat daftar foto struk bensin & tol, memperbesar foto, dan menghapus jika salah upload
            - **Input Bensin & Tol Per Surat Jalan**: Driver can directly log fuel & toll expenses with photo receipt and nominal
            - **In-App Auto Update**: Seamless automatic version prompt
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
