name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Create Flutter Project Skeleton if needed
        run: |
          echo "Generating clean standard Flutter Android runner..."
          flutter create --org com.precision --project-name trucking_mobile --platforms android .
          
          # Ensure subprojects have compileSdkVersion 34 for geolocator
          cat << 'EOF' >> android/build.gradle
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 34
                      }
                  }
              }
          }
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: precision-trucking-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.1.0
          name: Precision Trucking Driver GPS v1.1.0
          body: |
            ## 🚚 Precision Trucking Driver Companion (Native App)
            - **No WebView**: 100% Native Mobile Flutter UI (Dark Futuristic Bento Design)
            - **Driver Login**: Direct credential authentication via Laravel Sanctum REST API
            - **GPS Live Tracking**: Native OpenStreetMap tiles, live telemetry (Speed, Battery, Ping Counter)
            - **High-Accuracy Background GPS**: Continuous hardware sensor stream
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
